name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  collaboration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Generate and validate collaboration protocol
        run: |
          node protocol/scripts/generate.mjs
          git diff --exit-code -- protocol/generated clients/mobile/lib/core/protocol clients/codex-pc/src-tauri/src/protocol
          node protocol/scripts/validate.mjs
          node protocol/scripts/mock-smoke.mjs

  codex-pc-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/codex-pc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/codex-pc/package-lock.json
      - run: npm ci
      - run: npm run build

  codex-pc-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/codex-pc/package-lock.json
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Build desktop frontend
        working-directory: clients/codex-pc
        run: |
          npm ci
          npm run build
      - name: Check Tauri shell
        run: cargo check --manifest-path clients/codex-pc/src-tauri/Cargo.toml
      - name: Preserve Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: codex-pc-cargo-lock
          path: clients/codex-pc/src-tauri/Cargo.lock
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - name: Preserve Flutter lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pubspec-lock
          path: clients/mobile/pubspec.lock
          if-no-files-found: error

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: Verify generated Go sources
        working-directory: backend
        run: |
          go generate ./ent
          go run github.com/google/wire/cmd/wire@v0.7.0 ./cmd/server
          git diff --exit-code -- ent cmd/server/wire_gen.go
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
