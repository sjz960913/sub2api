services:
  sub2api-allinone:
    image: ${SUB2API_IMAGE:-ghcr.io/sjz960913/sub2api-allinone:latest}
    container_name: sub2api-allinone
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
    volumes:
      - ./data:/app/data
      - ./postgres_data:/var/lib/postgresql/data
      - ./redis_data:/var/lib/redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
